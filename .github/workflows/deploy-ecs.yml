name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin 123456789.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Build Docker image
        run: |
          docker build -t my-app .

      - name: Tag image
        run: |
          docker tag my-app:latest 123456789.dkr.ecr.$AWS_REGION.amazonaws.com/my-app:latest

      - name: Push image to ECR
        run: |
          docker push 123456789.dkr.ecr.$AWS_REGION.amazonaws.com/my-app:latest

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull 123456789.dkr.ecr.$AWS_REGION.amazonaws.com/my-app:latest
            docker stop my-app || true
            docker rm my-app || true
            docker run -d -p 80:80 --name my-app \
            123456789.dkr.ecr.$AWS_REGION.amazonaws.com/my-app:latest
